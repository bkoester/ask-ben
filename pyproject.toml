[project]
name = "askben"
version = "0.1.0"
description = "Retrieval bot over Ben Koester's writing, with a public evaluation harness"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "anthropic>=0.40",
  "boto3>=1.35",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["askben"]

[tool.ruff]
line-length = 100
